server {
    listen 80;

    # Disable absolute redirects to prevent Nginx from inserting 'localhost' into redirects
    absolute_redirect off;

    # The directory where the frontend build files are stored inside the container.
    root /usr/share/nginx/html;

    # Content-Security-Policy
    # - script-src/style-src allow Google Maps JS SDK (injects inline styles + its own scripts)
    # - img-src allows any https origin since users can paste arbitrary image URLs, plus data: for inline previews
    # - connect-src allows same-origin API calls (via reverse proxy) and the Openinary image host
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://maps.googleapis.com https://*.googleapis.com https://openinary.fahmiefendy.dev; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Serve the frontend static files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
